# Reference for OpenShift 4.19–4.22; 4.18 uses the Terraform compatibility template.
# Do not apply this alongside Terraform ownership. Confirm platform support first.
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
spec:
  uninstallStrategy: BlockUninstallIfWorkloadsExist
  enableCommonBootImageImport: false
  infra:
    nodePlacement: {}
  workloads:
    nodePlacement:
      nodeSelector:
        node-role.kubernetes.io/virtualization: ""
      tolerations:
        - key: virtualization
          operator: Equal
          value: "true"
          effect: NoSchedule
