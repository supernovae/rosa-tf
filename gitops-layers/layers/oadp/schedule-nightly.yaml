# Reference only: verify a one-off backup AND restore before unpausing.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: nightly-user-backup
  namespace: openshift-adp
spec:
  schedule: "0 2 * * *"
  paused: true
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces: [vm-workloads]
    storageLocation: rosa-dpa-1
    ttl: 720h
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
