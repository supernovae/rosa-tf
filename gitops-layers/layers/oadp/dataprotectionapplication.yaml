# VM profile reference: requires supported OpenShift Virtualization and OADP.
# Replace bucket/region and use the Subscription ROLEARN flow; do not co-manage
# cloud-credentials. For container-only use omit kubevirt.
apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: rosa-dpa
  namespace: openshift-adp
spec:
  backupImages: false
  backupLocations:
    - velero:
        provider: aws
        default: true
        objectStorage:
          bucket: REPLACE_WITH_BACKUP_BUCKET
          prefix: velero
        config:
          region: us-east-1
          enableSharedConfig: "true"
          profile: default
        credential:
          key: credentials
          name: cloud-credentials
  configuration:
    velero:
      defaultPlugins: [openshift, aws, csi, kubevirt]
      defaultSnapshotMoveData: true
      disableFsBackup: true
      resourceTimeout: 10m
    nodeAgent:
      enable: true
      uploaderType: kopia
      podConfig:
        tolerations:
          - key: virtualization
            operator: Equal
            value: "true"
            effect: NoSchedule
