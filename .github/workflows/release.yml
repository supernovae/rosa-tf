# Release Workflow
# Manually triggered to create a tagged release with validation gates.
#
# Usage:
#   1. Go to Actions > Release > Run workflow
#   2. Enter version tag (e.g., v2.0.0)
#   3. Enter changelog description
#   4. Workflow validates, tags, and creates a GitHub release

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v2.0.0)"
        required: true
      changelog:
        description: "Changelog summary for this release"
        required: true

permissions:
  contents: read
  security-events: write

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  CHECKPOINT_DISABLE: 1

jobs:
  v2-contracts:
    name: V2 provider and deployment contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - run: python3 -m unittest discover -s tests/release -p 'test_*.py'
      - run: python3 scripts/check-doc-links.py
      - run: terraform -chdir=modules/cluster/component-routes init -backend=false -lockfile=readonly
      - run: terraform -chdir=modules/cluster/component-routes test
      - run: terraform -chdir=modules/cluster/machine-pools-hcp init -backend=false -lockfile=readonly
      - run: terraform -chdir=modules/cluster/machine-pools-hcp test

  release-readiness:
    name: Stable provider and release approval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require reviewed main and stable RHCS
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/check-release-ready.py "$RELEASE_VERSION"

  efs-tests:
    name: EFS security and integration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: terraform -chdir=tests/efs test
      - run: python -m pip install PyYAML==6.0.2 python-hcl2==8.1.4
      - run: python scripts/check-efs-contracts.py
      - run: terraform -chdir=modules/gitops-layers/efs-storage init -backend=false -lockfile=readonly
      - run: terraform -chdir=modules/gitops-layers/efs-storage test

  oadp-tests:
    name: OADP security, schemas and VM recovery contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: terraform -chdir=tests/oadp test
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0 python-hcl2==8.1.4
      - run: python scripts/check-oadp-contracts.py
      - run: terraform -chdir=modules/gitops-layers/oadp init -backend=false -lockfile=readonly
      - run: terraform -chdir=modules/gitops-layers/oadp test

  virtualization-tests:
    name: Virtualization and NetApp interoperability contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: terraform -chdir=tests/virtualization test
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0 python-hcl2==8.1.4
      - run: python scripts/check-virtualization-contracts.py

  netapp-tests:
    name: NetApp storage security and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: terraform -chdir=tests/netapp test
      - run: python -m pip install PyYAML==6.0.2 python-hcl2==8.1.4
      - run: python scripts/check-netapp-contracts.py
      - run: terraform -chdir=modules/gitops-layers/netapp-storage init -backend=false -lockfile=readonly
      - run: terraform -chdir=modules/gitops-layers/netapp-storage test

  gitops-tests:
    name: GitOps security contracts and release schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: terraform -chdir=tests/gitops test
      - run: python -m unittest discover -s tests/gitops -p 'test_*.py'
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0 python-hcl2==8.1.4
      - run: python scripts/check-gitops-schemas.py

  monitoring-tests:
    name: Monitoring templates and release schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: terraform -chdir=tests/monitoring test
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
      - run: python scripts/check-monitoring-schemas.py
      - name: Initialize mocked monitoring storage tests
        run: terraform -chdir=modules/gitops-layers/monitoring init -backend=false -lockfile=readonly
      - name: Verify retention, encryption and partition boundaries
        run: terraform -chdir=modules/gitops-layers/monitoring test

  certmanager-tests:
    name: cert-manager templates and release schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test template behavior
        run: terraform -chdir=tests/certmanager test
      - name: Install schema checker dependencies
        run: python -m pip install PyYAML==6.0.2 jsonschema==4.23.0
      - name: Check pinned release schemas
        run: python scripts/check-certmanager-schemas.py

  network-tests:
    name: Zero-egress network regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Initialize network tests
        working-directory: modules/networking/vpc
        run: terraform init -backend=false -lockfile=readonly
      - name: Verify isolated and NAT network plans
        working-directory: modules/networking/vpc
        run: terraform test

  #----------------------------------------------------------------------------
  # Gate 1: Terraform Format + Validation
  #----------------------------------------------------------------------------
  validate:
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - commercial-classic
          - commercial-hcp
          - govcloud-classic
          - govcloud-hcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -lockfile=readonly

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -json | jq -e 'if .valid and .warning_count == 0 then . else error(tojson) end'

  bootstrap-tests:
    name: Fresh bootstrap (${{ matrix.cluster_type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster_type: [classic, hcp]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      - name: Initialize test module
        working-directory: modules/cluster/rosa-${{ matrix.cluster_type }}
        run: terraform init -backend=false -lockfile=readonly
      - name: Test native bootstrap
        working-directory: modules/cluster/rosa-${{ matrix.cluster_type }}
        run: bash ../../../scripts/test-bootstrap.sh

  #----------------------------------------------------------------------------
  # Gate 2: Security Scanning
  #----------------------------------------------------------------------------
  grype:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Grype filesystem scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: "."
          fail-build: true
          severity-cutoff: high

  checkov:
    name: Checkov Policy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: "."
          severity: warning
          format: gcc
        env:
          SHELLCHECK_OPTS: -x -e SC1091

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  #----------------------------------------------------------------------------
  # Release: Tag and publish (runs after all gates pass)
  #----------------------------------------------------------------------------
  release:
    name: Create Release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANGELOG: ${{ inputs.changelog }}
    runs-on: ubuntu-latest
    needs: [v2-contracts, release-readiness, validate, bootstrap-tests, network-tests, certmanager-tests, monitoring-tests, gitops-tests, netapp-tests, virtualization-tests, oadp-tests, efs-tests, grype, checkov, shellcheck, gitleaks]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify tag does not exist
        run: |
          if git rev-parse "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "ERROR: Tag $RELEASE_VERSION already exists."
            exit 1
          fi

      - name: Generate changelog from commits
        id: auto_changelog
        run: |
          # Find the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag: $PREV_TAG"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "No previous tag found, using full history"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi
          
          # Write to file to preserve multiline content
          {
            echo "## What's Changed"
            echo ""
            printf '%s\n' "$RELEASE_CHANGELOG"
            echo ""
            echo "## Commits since ${PREV_TAG:-initial}"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "*Full diff: [${PREV_TAG:-initial}...$RELEASE_VERSION](https://github.com/$GITHUB_REPOSITORY/compare/${PREV_TAG:-main}...$RELEASE_VERSION)*"
          } > release-notes.md
          
          cat release-notes.md

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/check-release-ready.py "$RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
